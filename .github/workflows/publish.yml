name: Publish

# A version tag push (e.g. 0.4.0) creates the GitHub release and publishes
# to GitHub Packages. Publishing also runs for releases created by hand.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
